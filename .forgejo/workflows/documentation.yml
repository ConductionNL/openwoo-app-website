name: Publish docs

# Docs deploy ONLY from the dedicated `documentation` branch — decoupled from main/development
# so doc edits never trigger releases and code releases never trigger doc builds. No cron.
on:
  push:
    branches: [documentation]
  pull_request:
    branches: [documentation]
  workflow_dispatch:

# Serialize Publish docs runs so that the chained `push` trigger and the
# explicit `workflow_dispatch` from woo-oas-sync (belt-and-suspenders, see
# .forgejo/workflows/woo-oas-sync.yml) can't both race a Cloudflare deploy
# against the same project. `cancel-in-progress: false` keeps a real
# documentation push from being killed by an in-flight OAS-sync dispatch.
concurrency:
  group: openwoo-docs-publish
  cancel-in-progress: false

jobs:
  build:
    uses: Conduction/.github/.forgejo/workflows/documentation-build.yml@main
    with:
      source-folder: .
    secrets: inherit

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    uses: Conduction/.github/.forgejo/workflows/documentation-deploy.yml@main
    with:
      cf-project-name: openwoo-app-website-docs
    secrets: inherit
