name: Publish docs

on:
  push:
    branches: [documentation, main, development]
  pull_request:
    branches: [documentation, main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  build:
    uses: Conduction/.github/.forgejo/workflows/documentation-build.yml@main
    with:
      # The Docusaurus project (package.json + docusaurus.config.js) lives at the
      # repo ROOT here, not under docs/ — docs/ is only the markdown content folder.
      # `npm run build` therefore emits the site to ./build, so the build+verify
      # reusable must treat the repo root as the source folder. With source-folder: docs
      # the reusable looked for docs/build/index.html, which never exists, failing every run.
      source-folder: .
    secrets: inherit

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    uses: Conduction/.github/.forgejo/workflows/documentation-deploy.yml@main
    with:
      cf-project-name: openwoo-app-website-docs
    secrets: inherit
