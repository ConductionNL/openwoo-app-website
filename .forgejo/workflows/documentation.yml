name: Publish docs

# MOTHBALLED (2026-08-17): GitHub is the source of truth; openwoo.app is
# served from the container image built by .github/workflows/dockerimage.yml
# on merge to `documentation`. Codeberg only receives one-way mirror pushes
# from GitHub, which must NOT redeploy the retired Cloudflare Pages project —
# so the push/pull_request triggers are removed. workflow_dispatch is kept
# as the emergency lever: it still deploys to the openwoo-docs Pages project
# as long as that project exists.
on:
  workflow_dispatch:

# Serialize Publish docs runs so that the chained `push` trigger and the
# explicit `workflow_dispatch` from woo-oas-sync (belt-and-suspenders, see
# .forgejo/workflows/woo-oas-sync.yml) can't both race a Cloudflare deploy
# against the same project. `cancel-in-progress: false` keeps a real
# documentation push from being killed by an in-flight OAS-sync dispatch.
concurrency:
  group: openwoo-docs-publish
  cancel-in-progress: false

jobs:
  build:
    uses: Conduction/.github/.forgejo/workflows/documentation-build.yml@main
    with:
      source-folder: .
    secrets: inherit

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    uses: Conduction/.github/.forgejo/workflows/documentation-deploy.yml@main
    with:
      cf-project-name: openwoo-docs
    secrets: inherit
