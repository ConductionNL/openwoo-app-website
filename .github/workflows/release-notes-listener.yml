name: Release notes listener

# Phase-1 of deliverable #1 from hydra#279. Receives a repository_dispatch
# from a stack-component repo (e.g. opencatalogi) whenever it publishes
# a stable GitHub Release. Writes the release body into
# docs/releases/<source_app>/<tag>.md and pushes to main; the existing
# deploy.yml then rebuilds openwoo.conduction.nl.
#
# Producers register under additive event_types so a new component can
# be onboarded by extending the `types:` array — no fan-in code needs
# to change in this workflow.

on:
  repository_dispatch:
    types:
      - opencatalogi-release-published

permissions:
  contents: write
  actions: write

jobs:
  write-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate payload
        env:
          SOURCE_APP: ${{ github.event.client_payload.source_app }}
          TAG:        ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_APP}" || -z "${TAG}" ]]; then
            echo "::error::client_payload missing source_app or tag"
            exit 1
          fi
          # Tag whitelist — letters, digits, dot, dash, underscore, slash.
          # Reject anything else so the payload can't write to ../../etc.
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::tag '${TAG}' contains characters outside [A-Za-z0-9._/-]"
            exit 1
          fi
          if [[ ! "${SOURCE_APP}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::source_app '${SOURCE_APP}' must be lowercase kebab-case"
            exit 1
          fi

      - name: Render release-notes markdown
        env:
          SOURCE_APP:   ${{ github.event.client_payload.source_app }}
          SOURCE_REPO:  ${{ github.event.client_payload.source_repo }}
          TAG:          ${{ github.event.client_payload.tag }}
          NAME:         ${{ github.event.client_payload.name }}
          BODY:         ${{ github.event.client_payload.body }}
          HTML_URL:     ${{ github.event.client_payload.html_url }}
          PUBLISHED_AT: ${{ github.event.client_payload.published_at }}
        run: |
          set -euo pipefail

          # Replace `/` in tag with `-` for the filename, to allow
          # nested tags like `release/1.2.0` while keeping a flat layout.
          safe_tag="${TAG//\//-}"
          dir="docs/releases/${SOURCE_APP}"
          file="${dir}/${safe_tag}.md"
          mkdir -p "${dir}"

          # YAML frontmatter values that quote a user-controlled string
          # need single quotes escaped. Python here-doc is the easiest
          # way to do this without spawning a JSON parser.
          python3 - "$file" <<'PY'
          import os, sys
          path = sys.argv[1]
          fm_title = f"{os.environ['NAME'] or os.environ['TAG']}"
          fm_description = f"Release {os.environ['TAG']} van {os.environ['SOURCE_APP']}."
          # Single-quote YAML scalar: replace single-quotes with doubled.
          def yaml_sq(s: str) -> str:
              return "'" + s.replace("'", "''") + "'"
          frontmatter = (
              "---\n"
              f"title: {yaml_sq(fm_title)}\n"
              f"description: {yaml_sq(fm_description)}\n"
              f"slug: /releases/{os.environ['SOURCE_APP']}/{os.environ['TAG'].replace('/', '-')}\n"
              "---\n"
          )
          body_md = (
              f"# {fm_title}\n\n"
              f"**Release:** [`{os.environ['TAG']}`]({os.environ['HTML_URL']})  \n"
              f"**Gepubliceerd op:** {os.environ['PUBLISHED_AT']}  \n"
              f"**Bron:** [{os.environ['SOURCE_REPO']}](https://github.com/{os.environ['SOURCE_REPO']})\n\n"
              "---\n\n"
              f"{os.environ['BODY']}\n"
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(frontmatter)
              f.write(body_md)
          PY

          echo "Wrote ${file}"

      - name: Commit release notes
        env:
          SOURCE_APP: ${{ github.event.client_payload.source_app }}
          TAG:        ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/releases/
          if git diff --staged --quiet; then
            echo "No changes to commit — release-notes payload was identical to existing file."
            exit 0
          fi
          git commit -m "docs(releases): ${SOURCE_APP} ${TAG} via dispatch"
          git push origin HEAD:main

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The push above uses GITHUB_TOKEN, which by design does NOT
        # trigger workflow_run on other workflows. Explicitly dispatch
        # the existing deploy.yml so openwoo.conduction.nl rebuilds.
        run: gh workflow run deploy.yml --ref main
