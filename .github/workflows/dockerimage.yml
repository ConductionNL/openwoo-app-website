# Docker Image CI — builds the openwoo.app docs-site image.
#
# Modeled on woo-website-template-apiv2/.github/workflows/dockerimage.yml
# (the fleet standard): GitHub-hosted buildx build, runtime smoke test
# BEFORE anything is pushed, declarative tags via docker/metadata-action,
# actions pinned on commit SHA (supply-chain policy).
#
# Deploy contract: merging to `documentation` publishes
#   ghcr.io/conductionnl/openwoo-app-website:documentation   (moving pointer)
#   ghcr.io/conductionnl/openwoo-app-website:sha-<full-sha>  (immutable)
# The runtime that serves openwoo.app behind Cloudflare tracks the
# :documentation tag (or pins the digest printed in the job summary), so a
# merge updates the live site — same contract the Codeberg/Cloudflare-Pages
# pipeline had, with the image registry in between.
#
# Triggers:
#   pull_request → documentation   build + smoke test only, never pushes
#   push documentation             image :documentation + sha tag
#   workflow_dispatch              manual rebuild of any ref
#
# The `github.server_url` guard keeps this a no-op on Forgejo/Codeberg,
# which also executes files under .github/workflows.

name: Docker Image CI

on:
  pull_request:
    branches: [documentation]
  push:
    branches: [documentation]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never cancel a branch build; PR builds may be superseded by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      # Suppress docker/build-push-action's own job summary + build-record
      # artifact; our own summary step below shows tags + digest.
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # All tag logic lives HERE, declaratively. metadata-action lowercases
      # the image name itself (ConductionNL → conductionnl).
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/openwoo-app-website
          tags: |
            type=sha,format=long
            type=ref,event=branch

      # Build WITHOUT pushing, loaded into the local daemon so the smoke
      # test below can actually run the image. Build and push being separate
      # steps is the visible guarantee that nothing unsmoked is published.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runtime smoke test: run the freshly built image and require an
      # HTTP 200 from the homepage AND a docs page, plus the high-value
      # security header, before anything is pushed.
      - name: Smoke test (run + HTTP check)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openwoo-app-website:sha-${{ github.sha }}
        run: |
          docker run --rm --detach --name smoke -p 8080:8080 "${IMAGE,,}"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then ok=1; break; fi
            sleep 2
          done
          docs_ok=""
          headers_ok=""
          if [ -n "$ok" ]; then
            curl -fsS -o /dev/null http://localhost:8080/docs/Technical/installation/ && docs_ok=1
            curl -fsS -D headers.txt -o /dev/null http://localhost:8080/
            if grep -qi "^content-security-policy: frame-ancestors 'none'" headers.txt; then
              headers_ok=1
            else
              echo "--- received headers ---"; cat headers.txt
            fi
          fi
          echo "--- container logs ---"; docker logs smoke || true
          docker stop smoke || true
          if [ -z "$ok" ];        then echo "Smoke test FAILED: no HTTP 200 on / within 60s" >&2; exit 1; fi
          if [ -z "$docs_ok" ];   then echo "Smoke test FAILED: docs page did not answer" >&2; exit 1; fi
          if [ -z "$headers_ok" ]; then echo "Smoke test FAILED: CSP frame-ancestors header missing" >&2; exit 1; fi
          echo "Smoke test passed (HTTP 200 on / and docs page + security headers)"

      # Same build definition with push: true — every layer is a cache hit
      # from the build step above, so this is assembly + push, not a rebuild.
      - name: Push image (branch/dispatch only)
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha

      # The digest (only present after a real push) is the content-addressed
      # identity of the image — unlike tags it can never be repointed, so it
      # is the strongest pin a deployment can use (image@sha256:...).
      - name: Build result → job summary
        if: always() && steps.meta.outcome == 'success'
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            if [ -n "${DIGEST}" ]; then
              echo "### 📦 Image pushed"
              echo ""
              echo "Pin deployments on the digest (strongest, content-addressed):"
              echo ""
              echo '```'
              echo "ghcr.io/${OWNER,,}/openwoo-app-website@${DIGEST}"
              echo '```'
              echo ""
              echo "Tags pushed in this run:"
            else
              echo "### 🔍 Build check only — nothing was pushed"
              echo ""
              echo "Tags this build would publish:"
            fi
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${DIGEST}" ]; then
            echo "::notice title=Image pushed::ghcr.io/${OWNER,,}/openwoo-app-website@${DIGEST}"
          fi
